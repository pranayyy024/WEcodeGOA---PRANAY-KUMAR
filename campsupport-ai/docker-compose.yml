version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: campsupport_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: campsupport
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campsupport_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=campsupport
      - LLM_PROVIDER=mock
    depends_on:
      - mongodb

volumes:
  mongodb_data:
